[options]
HoldPkg = pacman glibc
# Stock pacman only knows uname's arch; CachyOS's patched pacman auto-detects v3.
# Declaring both explicitly lets us install x86_64_v3 packages from CachyOS repos.
Architecture = x86_64 x86_64_v3
CheckSpace
SigLevel = Required DatabaseOptional
ParallelDownloads = 5

# CachyOS x86-64-v3 optimized repositories (built for generic v3 CPUs)
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# CachyOS main repository (standard x86_64 packages)
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
